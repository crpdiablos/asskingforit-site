<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AssKingForIt</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h2>Kinks</h2>
<ul id="kinks-list">
  <li>Loading kinks...</li>
</ul>
  <div class="container">
    <h1>👑 Welcome to AssKingForIt 👑</h1>
    <p>The King is watching... are you assking for it?</p>

    <button id="pecker">🐓 Pet the Pecker</button>

    <form>
      <label for="prompt">What do you desire?</label><br>
      <input type="text" id="prompt" name="prompt" placeholder="Type your fantasy...">
      <button type="submit">Submit</button>
    </form>

    <div class="payments">
      <h3>Tip the King</h3>
      <a href="https://www.paypal.me/sonofthewatchers" target="_blank">💸 PayPal Tribute</a><br>
      <a href="https://buy.stripe.com/test_8wMcPI0zE7qFdfqeUU" target="_blank">💳 Stripe Tip</a>
    </div>
  </div>
  <script>
  fetch("/api/kinks")
    .then(res => res.json())
    .then(data => {
      const list = document.getElementById("kinks-list");
      list.innerHTML = "";

      data.kinks.forEach(kink => {
        const li = document.createElement("li");
        li.textContent = kink;
        list.appendChild(li);
      });
    })
    .catch(err => {
      console.error("Failed to load kinks", err);
    });
</script>
</body>
</html>
